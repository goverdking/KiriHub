<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b17"><title>开启故事 · KiriHub</title><link rel="icon" href="/assets/webgal-ui-v1/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/webgal-ui-v1/player.css"><script type="module" src="/assets/webgal-ui-v1/player.js"></script></head>
<body><header class="player-bar"><button id="back" class="bar-button" aria-label="返回游戏库"><svg class="icon"><use href="/assets/webgal-ui-v1/icons.svg#back"></use></svg><span>游戏库</span></button><div class="bar-divider"></div><span id="game-name" class="game-name">正在准备故事</span><span id="player-hint" class="player-hint">首次加载可能需要一点时间</span><button id="help" class="bar-button icon-only" aria-label="查看操作说明"><svg class="icon"><use href="/assets/webgal-ui-v1/icons.svg#info"></use></svg></button><button id="fullscreen" class="bar-button" aria-label="进入全屏"><svg class="icon"><use href="/assets/webgal-ui-v1/icons.svg#monitor"></use></svg><span>全屏</span></button></header>
<main class="player-stage"><iframe id="game-frame" title="游戏画面" allow="autoplay; fullscreen; gamepad" allowfullscreen hidden></iframe><section class="launch-screen" id="launch-screen" aria-live="polite"><div class="launch-art" id="launch-art"></div><div class="launch-content"><img class="launch-logo" src="/assets/webgal-ui-v1/mark.svg" width="38" height="38" alt="KiriHub"><p class="launch-eyebrow">YOUR STORY IS ABOUT TO BEGIN</p><h1 id="launch-title">下一段故事，正在展开</h1><div class="launch-line"><span class="loader" id="loader"></span><p id="launch-status">正在读取游戏资料…</p></div><p id="launch-note">游戏存档保留在当前浏览器中。</p><div class="launch-actions"><button id="retry" class="launch-button" hidden>重新加载</button><a href="/" class="launch-link">返回游戏库 <span>↗</span></a></div></div></section></main>
<dialog id="help-dialog"><button class="dialog-close" data-close aria-label="关闭">×</button><h2>让故事顺畅继续</h2><p>点击游戏画面可启用声音，并将键盘操作交给游戏。</p><dl><dt>下一句</dt><dd>点击画面 / Enter / 空格</dd><dt>快速跳过</dt><dd>按住 Ctrl</dd><dt>保存与读取</dt><dd>使用游戏内的 SAVE / LOAD</dd><dt>全屏</dt><dd>点击顶部全屏按钮，Esc 退出</dd></dl><p class="help-note">各游戏的按键设置可能不同。更换网址或设备后，浏览器存档不会自动同步。</p><button class="launch-button" data-close>知道了</button></dialog>
<dialog id="leave-dialog"><h2>返回游戏库？</h2><p>请先在游戏内保存。离开后，未保存的进度将会丢失。</p><div class="leave-actions"><button class="launch-button secondary" data-close>继续游玩</button><button class="launch-button" id="confirm-leave">返回游戏库</button></div></dialog>
<button id="exit-fullscreen" class="fullscreen-exit" aria-label="退出全屏">退出全屏 ↙</button></body></html>

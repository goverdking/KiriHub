name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_public_source.py
      - run: python -m unittest discover -s backend -p 'test_probe_contract.py' -v
